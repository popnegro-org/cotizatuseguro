name: Retry pending lead deliveries

# TEMPORARILY PAUSED — restore triggers only after HubSpot scopes are verified.
# Previous schedule: */5 * * * *
# Previous manual trigger: workflow_dispatch
# No trigger is defined while this workflow is paused.

permissions:
  contents: read

concurrency:
  group: lead-delivery-retry
  cancel-in-progress: false

jobs:
  retry:
    if: ${{ vars.LEAD_RETRY_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Retry due leads
        env:
          LEAD_RETRY_SECRET: ${{ secrets.LEAD_RETRY_SECRET }}
        run: |
          set -euo pipefail
          if [ -z "${LEAD_RETRY_SECRET}" ]; then
            echo "::error::Configure the repository secret LEAD_RETRY_SECRET before enabling the retry scheduler."
            exit 1
          fi
          curl --fail-with-body --silent --show-error \
            --request POST \
            --max-time 60 \
            --header "Authorization: Bearer ${LEAD_RETRY_SECRET}" \
            "https://cotizatuseguro.com.ar/api/leads/retry"
